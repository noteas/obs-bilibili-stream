name: Build Project
on:
  workflow_call:
    outputs:
      pluginName:
        description: Project name detected by parsing build spec file
        value: ${{ jobs.check-event.outputs.pluginName }}
jobs:
  check-event:
    name: Check GitHub Event Data 🔎
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      package: ${{ steps.setup.outputs.package }}
      codesign: ${{ steps.setup.outputs.codesign }}
      notarize: ${{ steps.setup.outputs.notarize }}
      config: ${{ steps.setup.outputs.config }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      pluginName: ${{ steps.setup.outputs.pluginName }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Event Data ☑️
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Check Event Data ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              config_data=('codesign:false' 'notarize:false' 'package:false' 'config:Release')
              if gh pr view ${{ github.event.number }} --json labels \
                | jq -e -r '.labels[] | select(.name == "Seeking Testers")' > /dev/null; then
                config_data[0]='codesign:true'
                config_data[2]='package:true'
              fi
              ;;
            push)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:Release')
              if [[ ${GITHUB_REF_NAME} =~ [0-9]+.[0-9]+.[0-9]+(-(rc|beta).+)? ]]; then
                config_data[1]='notarize:true'
              fi
              ;;
            workflow_dispatch)
              config_data=('codesign:false' 'notarize:false' 'package:true' 'config:Release')
              ;;
            schedule)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:Release')
              ;;
            *) ;;
          esac

          for config in "${config_data[@]}"; do
            IFS=':' read -r key value <<< "${config}"
            echo "${key}=${value}" >> $GITHUB_OUTPUT
          done
          echo "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

          plugin_name="$(grep 'name' buildspec.json | sed -E -e 's/^.+"name":[^"]+"(.+)",?$/\1/g')"
          plugin_display_name="$(grep 'displayName' buildspec.json | sed -E -e 's/^.+"displayName":[^"]+"(.+)",?$/\1/g' || echo "")"

          if [[ "${plugin_display_name}" ]]; then
            echo "pluginName=${plugin_display_name}" >> $GITHUB_OUTPUT
          else
            echo "pluginName=${plugin_name}" >> $GITHUB_OUTPUT
          fi

  ubuntu-build:
    name: Build for Ubuntu 🐧
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    needs: check-event
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          read -r product_name product_version <<< \
            "$(jq -r '. | {name, version} | join(" ")' buildspec.json)"

          echo "pluginName=${product_name}" >> $GITHUB_OUTPUT
          echo "pluginVersion=${product_version}" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v6
        id: ccache-cache
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-${{ needs.check-event.outputs.config }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}

      # 侧栏(ADR-0010)让插件链接 Qt:插件二进制引用的 Qt 符号必须 ⊆ allowlist(每个符号都
      # 对照过最老受支持 Qt 的导出表),否则旧版 OBS 自带的 Qt 会在 dlopen 时缺符号。
      # 只在 24.04 审计:24.04 产物是承诺「OBS 30.0+(Qt 6.2.4+)」的那一份。26.04 的 Qt 6.10
      # 头文件把 QObject::setProperty 实现为内联转发到 QObject::doSetProperty(Qt 6.6 起才导出,
      # 6.2.4 没有),在 26.04 编出的 .so 天然只能加载到 Qt >= 6.6 的 OBS 上——它的 zip 本就
      # 按发行版标注(连带 libobs 主版本),审计下限对它不成立,也不该把 doSetProperty 放进名单。
      - name: Audit Qt symbols 🔍
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          python3 tests/check_qt_symbols.py --selftest
          python3 tests/check_qt_symbols.py build_x86_64/bilibili-stream-for-obs.so

      # 无头集成:真实 libobs + 真实 Qt(offscreen)+ 假 B站服务端,把编译出的 .so 装进来
      # 走完登录/获取推流码/二次确认/找回/退出卸载全流程(libobs 热键子系统要 X display)。
      # 只在 24.04 跑:CA 垫片对应发行版 libcurl 的 CA 装载入口。
      - name: Headless integration harness 🧪
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: xvfb-run -a tests/harness/run_headless.sh build_x86_64/tests/bili_harness build_x86_64/bilibili-stream-for-obs.so

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Package Plugin Directory Zip 📦
        shell: bash
        run: |
          : Package Plugin Directory Zip
          # 用户插件目录布局(OBS %module% 模板):bin/64bit/<lib> + data/,
          # 解压即用: unzip -d ~/.config/obs-studio/plugins/bilibili-stream-for-obs/
          src="$(find build_x86_64 -name 'bilibili-stream-for-obs.so' -print -quit)"
          if [ -z "$src" ]; then
            echo "::error::.so not found after build"
            exit 1
          fi
          stage="$(mktemp -d)"
          mkdir -p "$stage/bin/64bit" "$stage/data/locale"
          cp "$src" "$stage/bin/64bit/"
          # data/locale/*.ini = 界面文案 i18n 必装项(缺了 obs_module_text 只回显键名)
          cp data/locale/en-US.ini data/locale/zh-CN.ini "$stage/data/locale/"
          printf '%s\n' \
            '安装: 解压本 zip 到 ~/.config/obs-studio/plugins/bilibili-stream-for-obs/ (得到 bin/64bit/ 与 data/)。' \
            'data/locale/ 为界面文案(zh-CN/en-US),必须与 .so 同装。' \
            > "$stage/data/README.txt"
          ( cd "$stage" && zip -rq plugin.zip bin data )
          dst="release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64-${{ matrix.os }}.zip"
          sudo mkdir -p release
          sudo cp -f "$stage/plugin.zip" "$dst"
          sudo chown "$(id -u):$(id -g)" "$dst"
          rm -rf "$stage"
          echo "plugin dir zip: $dst"

      - name: Upload Source Tarball 🗜️
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-${{ matrix.os }}-sources-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-source.*

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-${{ matrix.os }}-x86_64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64*.*

      - uses: actions/cache/save@v6
        if: github.event_name != 'pull_request' && steps.ccache-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-${{ needs.check-event.outputs.config }}

  flatpak-build:
    name: Build Flatpak Plugin 📦
    runs-on: ubuntu-24.04
    needs: check-event
    # 失败不应阻塞其他平台产物与 Release。
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      # tmpfs 隔离 ostree 仓库:GH Runner 的容器根是 overlayfs,ostree 对镜像内
      # 既有 runtime 做「更新合并」时 renameat2(RENAME_WHITEOUT) 在 overlay 上
      # 报 EXDEV(Invalid cross-device link),flatpak-builder 依赖更新阶段随机
      # 失败(2026-11-26 复盘:同 workflow 同 image digest,当日 5 次运行成败交替;
      # 新 ref 的全新 pull 不触发,仅合并更新触发)。tmpfs 完整支持 rename 语义,
      # /var/lib/flatpak 挂 tmpfs 后所有 ostree 写离开 overlayfs ⇒ 故障路径消失。
      # 代价 = 每次全新拉取 runtime(镜像预置被遮,数分钟)。
      # 必须显式 exec:docker --tmpfs 默认含 noexec,SDK 部署在 tmpfs 上的
      # cmake/ninja 在 bwrap 沙箱里 execvp 报 Permission denied(run 45859467119)。
      options: --privileged --tmpfs /var/lib/flatpak:rw,exec,size=8g
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          read -r product_name product_version <<< \
            "$(jq -r '. | {name, version} | join(" ")' buildspec.json)"

          echo "pluginName=${product_name}" >> $GITHUB_OUTPUT
          echo "pluginVersion=${product_version}" >> $GITHUB_OUTPUT

      # tmpfs 遮住了镜像预置的 system ostree 库,flathub remote 配置也一并消失
      # (2026-11-26 tmpfs 首轮验证:flatpak-builder --install-deps-from=flathub
      # 报 "error: No remote refs found for 'flathub'")。重新登记 remote:
      # remote-add 是纯本地配置写(写进 tmpfs),无网络无 helper;之后所有
      # pull/update 读写仍全部落 tmpfs,EXDEV 故障路径依旧封闭。
      - name: Add flathub Remote 🌐
        run: flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak Plugin 🧱
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb
        with:
          manifest-path: com.obsproject.Studio.Plugin.BilibiliStream.yaml
          bundle: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-flatpak-x86_64.flatpak
          branch: stable
          arch: x86_64
          upload-artifact: false

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-flatpak-x86_64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-flatpak-x86_64.flatpak

  windows-build:
    name: Build for Windows 🪟
    runs-on: windows-2022
    needs: check-event
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          # Set Up Environment 🔧
          if ( $Env:RUNNER_DEBUG -ne $null ) {
            Set-PSDebug -Trace 1
          }

          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          $ProductName = $BuildSpec.name
          $ProductVersion = $BuildSpec.version

          "pluginName=${ProductName}" >> $env:GITHUB_OUTPUT
          "pluginVersion=${ProductVersion}" >> $env:GITHUB_OUTPUT

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}

      - name: Audit Qt symbols 🔍
        shell: pwsh
        run: |
          # 同 Ubuntu job:插件 .dll 引用的 Qt 符号必须 ⊆ tests/qt-symbol-allowlist.txt 并上
          # tests/qt-symbol-allowlist-msvc.txt(MSVC 本地生成 vftable 等多出的引用,ADR-0010)。
          $dll = Get-ChildItem -Path build_x64 -Recurse -Filter 'bilibili-stream-for-obs.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { Write-Error '.dll not found after build'; exit 1 }
          python tests/check_qt_symbols.py $dll.FullName

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Package Plugin Directory Zip 📦
        shell: pwsh
        run: |
          # 用户插件目录布局(OBS %module% 模板):bin/64bit/<lib> + data/。
          # 覆盖 Package-Windows.ps1 生成的安装布局 zip:三平台统一发「解压即用」zip,
          # 不再附裸 .dll。
          $dll = Get-ChildItem -Path build_x64 -Recurse -Filter 'bilibili-stream-for-obs.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) {
            Write-Error '.dll not found after build'
            exit 1
          }
          $stage = Join-Path $env:RUNNER_TEMP 'plugin-zip'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'bin/64bit') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'data/locale') | Out-Null
          Copy-Item $dll.FullName (Join-Path $stage 'bin/64bit/')
          # data/locale/*.ini = 界面文案 i18n 必装项(缺了 obs_module_text 只回显键名)
          Copy-Item data/locale/en-US.ini, data/locale/zh-CN.ini (Join-Path $stage 'data/locale/')
          Set-Content -Encoding utf8 -Path (Join-Path $stage 'data/README.txt') -Value @(
            '安装: 解压本 zip 到 %APPDATA%\obs-studio\plugins\bilibili-stream-for-obs\ (得到 bin\64bit\ 与 data\)。',
            'data\locale\ 为界面文案(zh-CN/en-US),必须与 DLL 同装。'
          )
          $dst = "release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64.zip"
          Compress-Archive -Force -CompressionLevel Optimal -Path (Join-Path $stage 'bin'), (Join-Path $stage 'data') -DestinationPath $dst
          Remove-Item -Recurse -Force $stage
          Write-Host "plugin dir zip: $dst (replaces installer-layout zip)"

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64*.*
